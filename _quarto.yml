project:
  type: website
  output-dir: docs

# Meta
description-meta: "Academic website of Alexander Buriticá Casanova"
author-meta: "Alexander Buriticá Casanova"

website:
  title: "Alexander Buriticá"
  favicon: "files/images/icon.png"
  image: "files/images/icon.png"
  description: "Agricultural and environmental economist. Impact evaluation, sustainable agriculture, and policy-relevant research."

  navbar:
    background: light
    left:
      - text: News
        menu:
          - text: News
            href: news2.qmd
          - text: Contact
            href: contact.qmd
      - text: Research
        menu:
          - text: Publications
            href: publications.qmd
          - text: Working Papers
            href: publications2.qmd
      - text: Field Work
        href: speakers.qmd

    right:
      - text: CV
        href: files/cv_ingles_v3.pdf
      - icon: github
        href: https://github.com/AlexanderBuritica
        target: _blank

  page-navigation: true

  page-footer:
    left: "© Alexander Buriticá Casanova · <script>document.write(new Date().getFullYear())</script>"
    center: ""
    right:
      - icon: github
        href: https://github.com/AlexanderBuritica
        target: _blank
      - text: "{{< fa brands bluesky >}}"
        href: https://bsky.app
        target: _blank
      - icon: envelope
        href: mailto:a.buritica@cgiar.org

  search:
    location: navbar
    type: textbox

  reader-mode: true
  draft-mode: unlinked

  repo-url: https://github.com/AlexanderBuritica/AlexBuritica.github.io

  open-graph: true
  twitter-card: true
  site-url: "https://alexanderburitica.github.io"

  google-analytics:
    tracking-id: ""
    anonymize-ip: true

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    include-in-header: "files/includes/_academic.qmd"
