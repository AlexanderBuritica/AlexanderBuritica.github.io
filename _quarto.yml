project:
  type: website
  output-dir: docs

# Meta
description-meta: "Academic website of Alexander Buriticá Casanova"
author-meta: "Alexander Buriticá Casanova"

website:
  title: "Alexander Buriticá"
  favicon: "files/images/icon.PNG"
  image: "files/images/Alex_Buritaca.JPG"
  description: "Agricultural and environmental economist."

  navbar:
    background: light
    left:
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: Talks
        href: talks.qmd
      - text: News
        href: news2.qmd
      - text: Contact
        href: contact.qmd

    right:
      - text: CV
        href: files/cv_ingles_v3.pdf
      - icon: github
        href: https://github.com/AlexanderBuritica
        target: _blank

  page-navigation: true

  page-footer:
    left: "© 2026 Alexander Buriticá Casanova"
    center: "Built with [Quarto](https://quarto.org/) · Hosted on [GitHub Pages](https://pages.github.com/)"
    right:
      - icon: envelope
        href: mailto:a.buritica@cgiar.org
      - icon: github
        href: https://github.com/AlexanderBuritica
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/alexander-buritica-casanova-738827155/
        target: _blank

  search:
    location: navbar
    type: textbox

  reader-mode: true
  draft-mode: unlinked

  repo-url: https://github.com/AlexanderBuritica/AlexBuritica.github.io

  open-graph: true
  twitter-card: true
  site-url: "https://alexanderburitica.github.io"

  google-analytics:
    tracking-id: ""
    anonymize-ip: true

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    include-in-header: "files/includes/_academic.qmd"
